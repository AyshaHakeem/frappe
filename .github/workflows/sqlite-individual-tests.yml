name: SQLite Individual

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: sqlite-individual-tests-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  SHARD_COUNT: 4

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      tests: ${{ steps.set-tests.outputs.tests }}
    steps:
      - uses: actions/checkout@v7
      - id: set-tests
        run: |
          tests=$(find . -path '*/doctype/*/test_*.py' | xargs grep -l 'def test_' | awk '{
              gsub(/^\.\//, "", $0)
              gsub(/\.py$/, "", $0)
              gsub(/\//, ".", $0)
              print
          }' | sort | jq -R . | jq -sc .)
          echo "tests=$tests" >> "$GITHUB_OUTPUT"
      - id: set-matrix
        run: |
          matrix=$(jq -nc --argjson count "$SHARD_COUNT" '{"include": [range(1; $count + 1) | {"shard": .}]}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  test:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # This profile deliberately has no web server. The setup action exports to avoid deadlock failures
    env:
      NODE_ENV: production
      ALL_TESTS: ${{ needs.discover.outputs.tests }}
      SHARD_INDEX: ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    name: SQLite Shard
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        name: Environment Setup
        with:
          python-version: "3.14"
          node-version: 24
          db: sqlite
          db-root-password: db_root
          # HTTP services are unnecessary for unit tests and can open extra SQLite connections.
          disable-web: true
          disable-socketio: true
      - name: Wait for setup jobs
        shell: bash
        run: |
          # Site creation can leave background jobs for the worker. Let those
          # finish before the test runner starts writing to SQLite, which only
          # permits one writer at a time.
          for attempt in {1..20}; do
            if bench --site test_site ready-for-migration; then
              exit 0
            fi
            echo "Waiting for setup jobs to finish (attempt $attempt/20)..."
            sleep 1
          done

          echo "Setup jobs did not finish within the expected time."
          bench --site test_site show-pending-jobs || true
          exit 1
      - name: Run Tests
        shell: bash
        run: |
          echo "$ALL_TESTS" | jq -r --argjson shard "$SHARD_INDEX" --argjson total "$SHARD_COUNT" \
            '[to_entries[] | select(.key % $total == ($shard - 1)) | .value] | .[]' > shard_tests.txt

          status=0
          while IFS= read -r test; do
            echo "::group::$test"
            bench --site test_site run-tests --app frappe --module "$test" || status=1
            echo "::endgroup::"
          done < shard_tests.txt

          exit $status

  http-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Run the HTTP contract separately, with every service those tests declare.
    env:
      NODE_ENV: production
    name: SQLite HTTP integration
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        name: Environment Setup
        with:
          python-version: "3.14"
          node-version: 24
          db: sqlite
          db-root-password: db_root
          disable-socketio: true
      - name: Wait for setup jobs
        shell: bash
        run: |
          for attempt in {1..20}; do
            if bench --site test_site ready-for-migration; then
              exit 0
            fi
            echo "Waiting for setup jobs to finish (attempt $attempt/20)..."
            sleep 1
          done

          echo "Setup jobs did not finish within the expected time."
          bench --site test_site show-pending-jobs || true
          exit 1
      - name: Run HTTP-dependent SQLite tests
        shell: bash
        run: |
          run_test() {
            local module="$1"
            shift
            bench --site test_site run-tests --app frappe --module "$module" "$@"
          }

          run_test frappe.automation.doctype.auto_repeat.test_auto_repeat --test test_email_notification
          run_test frappe.core.doctype.access_log.test_access_log --test test_private_file_download
          run_test frappe.core.doctype.file.test_file --test test_make_thumbnail
          run_test frappe.core.doctype.server_script.test_server_script --test test_api
          run_test frappe.integrations.doctype.connected_app.test_connected_app \
            --test test_web_application_flow \
            --test test_concurrent_refresh_skips_redundant_call
